# Shared Dependabot config for HandyPlugins repositories.
# Security fixes are grouped into one PR per ecosystem and arrive as soon as they are available.
# Routine version updates are grouped into one PR per ecosystem once a month.
version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      composer-security:
        applies-to: security-updates
        patterns: ["*"]
      composer-all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "America/New_York"
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-all:
        patterns: ["*"]
